<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hailey Perng — Film &amp; Photography</title>
  <meta name="description" content="Portfolio of film and photography work by Hailey Perng.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <!-- 3D library for the home page camera (must come before any module script) -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="/js/site.js"></script>
</head>
<body data-page="home">
  <header class="site-header" data-site-header></header>

  <main id="top">
    <section class="home-intro">
      <div>
        <p class="label">Filmmaker &amp; Photographer · Los Angeles</p>
        <h1 class="home-title">Hailey Perng<span>.</span></h1>
      </div>
      <p class="home-note">Placeholder intro line. Each piece of this camera opens part of my work. Hover a piece, or click the body to put it back together.</p>
    </section>

    <!-- Exploded camera: 3D model from js/camera3d.js, with the 2D drawing (js/camera.js) as fallback -->
    <section class="camera" data-camera aria-label="Sections">
      <p class="label camera-fig">Fig. 1 — Exploded assembly</p>
      <p class="label camera-rev">Dwg. HP-001 · Rev. B<br>Scale 1:1</p>
      <p class="label camera-hint">Hover a part · drag to rotate</p>
      <p class="label camera-loading" data-camera-loading>Loading model…</p>
      <button class="chip camera-toggle" type="button" data-camera-toggle>Assemble</button>
    </section>
  </main>

  <footer class="site-footer" data-site-footer></footer>

  <script type="module">
    const stage = document.querySelector("[data-camera]");
    let ok = false;
    try {
      // Canvas text (engravings) needs the fonts loaded first
      await Promise.race([document.fonts.ready, new Promise((r) => setTimeout(r, 1500))]);
      const { initCamera3D } = await import("/js/camera3d.js");
      ok = initCamera3D(stage);
    } catch (err) {
      console.warn("3D camera unavailable, using 2D drawing", err);
    }
    if (!ok) {
      const { initCamera } = await import("/js/camera.js");
      initCamera(stage);
    }
    stage.querySelector("[data-camera-loading]")?.remove();
  </script>
</body>
</html>
