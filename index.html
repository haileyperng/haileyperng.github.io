<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hailey Perng — Film &amp; Photography</title>
  <meta name="description" content="Portfolio of film and photography work by Hailey Perng.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <script type="module" src="/js/site.js"></script>
</head>
<body data-page="home">
  <header class="site-header" data-site-header></header>

  <main id="top">
    <section class="home-intro">
      <div>
        <p class="label">Filmmaker &amp; Photographer · Los Angeles</p>
        <h1 class="home-title">Hailey Perng<span>.</span></h1>
      </div>
      <p class="home-note">Placeholder intro line. Each piece of this camera opens part of my work. Hover a piece, or click the body to put it back together.</p>
    </section>

    <!-- Exploded camera: parts are generated by js/camera.js -->
    <section class="camera" data-camera aria-label="Sections">
      <p class="label camera-fig">Fig. 1 — Exploded view</p>
      <p class="label camera-rev">Dwg. HP-001 · Rev. A<br>Scale 1:1</p>
      <p class="label camera-hint">Move your cursor · hover a part</p>
      <button class="chip camera-toggle" type="button" data-camera-toggle>Assemble</button>
    </section>
  </main>

  <footer class="site-footer" data-site-footer></footer>

  <script type="module">
    import { initCamera } from "/js/camera.js";
    initCamera(document.querySelector("[data-camera]"));
  </script>
</body>
</html>
