<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photography — Hailey Perng</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <script type="module" src="/js/site.js"></script>
</head>
<body data-page="photo-series" data-section="photo">
  <header class="site-header" data-site-header></header>

  <!-- One template for every photo series. Content comes from data/photos.json, picked by ?id= -->
  <main id="top" class="detail" data-detail></main>

  <footer class="site-footer" data-site-footer></footer>

  <script type="module">
    import { loadJSON, esc, mediaHTML, getParam } from "/js/data.js";
    import { initLightbox } from "/js/lightbox.js";

    const all = await loadJSON("/data/photos.json");
    const main = document.querySelector("[data-detail]");
    const i = all.findIndex((s) => s.id === getParam("id"));

    if (i === -1) {
      main.innerHTML = `<p class="empty">Series not found. <a href="/photography/">Back to photography →</a></p>`;
    } else {
      const s = all[i];
      const prev = all[(i - 1 + all.length) % all.length];
      const next = all[(i + 1) % all.length];
      document.title = `${s.title} — Hailey Perng`;

      const photo = (img, n) => img.src
        ? `<a href="${esc(img.src)}" data-lightbox data-alt="${esc(img.alt)}" data-cursor-label="Open">${mediaHTML(img)}</a>`
        : mediaHTML({ aspect: img.aspect, label: `Photo ${n + 1}` });

      main.innerHTML = `
        <section class="page-head">
          <p class="label"><a href="/photography/">Photography</a> / ${esc(s.location)} · ${esc(s.year)}</p>
          <h1>${esc(s.title)}</h1>
          <p class="page-intro">${esc(s.description)}</p>
        </section>

        <div class="detail-body" style="padding-top:0">
          <dl class="facts">
            <dt class="label">Year</dt><dd>${esc(s.year)}</dd>
            <dt class="label">Location</dt><dd>${esc(s.location)}</dd>
            <dt class="label">Camera</dt><dd>${esc(s.camera)}</dd>
            <dt class="label">Images</dt><dd>${s.images.length}</dd>
          </dl>
        </div>

        <div class="masonry" data-gallery>${s.images.map(photo).join("")}</div>

        <nav class="pager" aria-label="More series">
          <a href="/photography/series.html?id=${encodeURIComponent(prev.id)}"><span class="label">← Previous</span>${esc(prev.title)}</a>
          <a href="/photography/series.html?id=${encodeURIComponent(next.id)}"><span class="label">Next →</span>${esc(next.title)}</a>
        </nav>`;

      initLightbox(main.querySelector("[data-gallery]"));
    }
  </script>
</body>
</html>
