<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photography — Hailey Perng</title>
  <meta name="description" content="Photography by Hailey Perng.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <script type="module" src="/js/site.js"></script>
</head>
<body data-page="photography" data-section="photo">
  <header class="site-header" data-site-header></header>

  <main id="top">
    <section class="page-head">
      <p class="label">02 · Aperture</p>
      <h1>Photography</h1>
      <p class="page-intro">Placeholder intro: a sentence or two about your photography. Photos come from data/photos.json.</p>
    </section>

    <div class="masonry photo-grid" data-gallery></div>
  </main>

  <footer class="site-footer" data-site-footer></footer>

  <script type="module">
    import { loadJSON, esc, mediaHTML } from "/js/data.js";
    import { initLightbox } from "/js/lightbox.js";

    // One grid of every photo, in the order listed in data/photos.json
    const photos = await loadJSON("/data/photos.json");
    const grid = document.querySelector("[data-gallery]");
    grid.innerHTML = photos.map((p, n) => p.src
      ? `<a href="${esc(p.src)}" data-lightbox data-alt="${esc(p.alt)}" data-cursor-label="Open">${mediaHTML(p)}</a>`
      : mediaHTML({ aspect: p.aspect, label: `Photo ${n + 1}` })).join("");
    initLightbox(grid);
  </script>
</body>
</html>
