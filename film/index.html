<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Film — Hailey Perng</title>
  <meta name="description" content="Film work by Hailey Perng.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <script type="module" src="/js/site.js"></script>
</head>
<body data-page="film" data-section="film">
  <header class="site-header" data-site-header></header>

  <main id="top">
    <section class="page-head">
      <p class="label">01 · Lens</p>
      <h1>Film</h1>
      <p class="page-intro">Placeholder intro: a sentence or two about the kind of films you make. Projects come from data/films.json.</p>
    </section>

    <div class="discovery-stage view-grid" data-grid></div>
  </main>

  <footer class="site-footer" data-site-footer></footer>

  <script type="module">
    import { loadJSON, esc, mediaHTML } from "/js/data.js";

    // One grid of every film, in the order listed in data/films.json
    const films = await loadJSON("/data/films.json");
    document.querySelector("[data-grid]").innerHTML = films.map((f) => `
      <a class="card" href="/film/project.html?id=${encodeURIComponent(f.id)}" data-cursor-label="Watch">
        <div class="card-media">${mediaHTML({ src: f.thumbnail, alt: f.title, aspect: f.aspect, label: f.title })}</div>
        <div class="card-info">
          <span class="card-title">${esc(f.title)}</span>
          <span class="label">${esc(f.year)}</span>
        </div>
      </a>`).join("");
  </script>
</body>
</html>
